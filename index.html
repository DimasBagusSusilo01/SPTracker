<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saga Enerva | Solar Panel Tracker</title>
  <title>HelioTrack | Access & Authentication</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41M12 7a5 5 0 100 10 5 5 0 000-10z'/></svg>">
</head>
<body>
  <div class="app-container">
    <div class="auth-page">
      
      <!-- Authentication Card -->
      <div class="auth-card">
        
        <!-- Header Branding -->
        <div class="auth-header">
          <div class="auth-logo-badge">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
          </div>
          <h1 class="auth-title">HelioTrack</h1>
          <p class="auth-subtitle">Smart Solar Tracker System Portal</p>
        </div>

        <!-- Supabase Configuration Status Banner -->
        <div id="config-status-banner" class="config-banner" style="display: none;">
          <div class="config-banner-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>Supabase Setup Standby</span>
          </div>
          <p>Kredensial API & Token Key masih berupa <code>'...'</code> di <strong>auth.js</strong>. Anda dapat mengisi kredensial tersebut kapan saja.</p>
          <div class="config-actions">
            <button type="button" class="btn btn-outline" id="btn-quick-demo" style="width: 100%; padding: 6px 10px; font-size: 0.78rem;">
              ⚡ Masuk Cepat (Demo Mode) &rarr;
            </button>
          </div>
        </div>

        <!-- Alert Notification Box -->
        <div id="auth-alert" class="auth-alert" style="display: none;">
          <div class="auth-alert-icon" id="alert-icon"></div>
          <div id="alert-message"></div>
        </div>

        <!-- Google Sign-In Button -->
        <button type="button" id="btn-google-auth" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.29 21.36 7.37 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.96 0 12s.46 3.84 1.26 5.42l4.02-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.29 2.64 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <div class="auth-divider">
          <span>atau dengan email</span>
        </div>

        <!-- Navigation Tabs: Sign In / Sign Up -->
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" id="tab-btn-signin">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            <span>Sign In</span>
          </button>
          <button type="button" class="auth-tab" id="tab-btn-signup">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            <span>Sign Up</span>
          </button>
        </div>

        <!-- ======================= -->
        <!-- SIGN IN FORM            -->
        <!-- ======================= -->
        <form id="form-signin" autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="signin-email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </span>
              <input type="email" id="signin-email" class="form-input" placeholder="dimas@heliotrack.io" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signin-password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" id="signin-password" class="form-input" placeholder="••••••••" required>
              <button type="button" class="input-toggle-pw" data-target="signin-password" title="Toggle password visibility">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="auth-row-between">
            <label class="auth-checkbox-label">
              <input type="checkbox" id="remember-me" checked>
              <span>Ingat saya</span>
            </label>
            <a href="#" id="link-forgot-pw" class="auth-link">Lupa Password?</a>
          </div>

          <button type="submit" id="btn-submit-signin" class="btn btn-primary btn-auth">
            <span class="btn-text">Sign In to Dashboard</span>
          </button>
        </form>

        <!-- ======================= -->
        <!-- SIGN UP FORM            -->
        <!-- ======================= -->
        <form id="form-signup" style="display: none;" autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input type="text" id="signup-name" class="form-input" placeholder="Dimas Bagus Susilo" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </span>
              <input type="email" id="signup-email" class="form-input" placeholder="dimas@heliotrack.io" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" id="signup-password" class="form-input" placeholder="Minimal 6 karakter" minlength="6" required>
              <button type="button" class="input-toggle-pw" data-target="signup-password" title="Toggle password visibility">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-confirm-password">Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 12 2 2 4-4"/><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" id="signup-confirm-password" class="form-input" placeholder="Ulangi password" minlength="6" required>
            </div>
          </div>

          <button type="submit" id="btn-submit-signup" class="btn btn-primary btn-auth">
            <span class="btn-text">Create New Account</span>
          </button>
        </form>

        <div class="auth-footer">
          <span>&copy; 2026 HelioTrack • Clean Solar Energy Infrastructure</span>
        </div>

      </div>
    </div>
  </div>

  <!-- Supabase SDK & Auth Controller -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Check if user already has an active session
      if (typeof HelioAuth !== 'undefined') {
        HelioAuth.checkLoginRedirect();
      }

      // 2. Elements
      const banner = document.getElementById('config-status-banner');
      const tabSignIn = document.getElementById('tab-btn-signin');
      const tabSignUp = document.getElementById('tab-btn-signup');
      const formSignIn = document.getElementById('form-signin');
      const formSignUp = document.getElementById('form-signup');
      const alertBox = document.getElementById('auth-alert');
      const alertMessage = document.getElementById('alert-message');
      const alertIcon = document.getElementById('alert-icon');
      const btnQuickDemo = document.getElementById('btn-quick-demo');
      const forgotLink = document.getElementById('link-forgot-pw');

      // 3. Show standby banner if Supabase credentials are still '...'
      if (typeof HelioAuth !== 'undefined' && !HelioAuth.isConfigured()) {
        if (banner) banner.style.display = 'block';
      }

      // Helper function to display alerts
      function showAlert(message, type = 'error') {
        alertBox.className = 'auth-alert ' + (type === 'success' ? 'auth-alert-success' : type === 'warning' ? 'auth-alert-warning' : 'auth-alert-error');
        alertIcon.innerHTML = type === 'success' 
          ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`
          : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
        alertMessage.textContent = message;
        alertBox.style.display = 'flex';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      // Helper to set button loading state
      function setButtonLoading(btn, isLoading, defaultText) {
        if (isLoading) {
          btn.disabled = true;
          btn.innerHTML = `<span class="spinner"></span> <span>Memproses...</span>`;
        } else {
          btn.disabled = false;
          btn.innerHTML = `<span class="btn-text">${defaultText}</span>`;
        }
      }

      // 4. Tab switching
      tabSignIn.addEventListener('click', () => {
        tabSignIn.classList.add('active');
        tabSignUp.classList.remove('active');
        formSignIn.style.display = 'block';
        formSignUp.style.display = 'none';
        hideAlert();
      });

      tabSignUp.addEventListener('click', () => {
        tabSignUp.classList.add('active');
        tabSignIn.classList.remove('active');
        formSignUp.style.display = 'block';
        formSignIn.style.display = 'none';
        hideAlert();
      });

      // 5. Toggle password visibility
      document.querySelectorAll('.input-toggle-pw').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (input) {
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.innerHTML = isPassword 
              ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
              : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
          }
        });
      });

      // 6. Sign In submit
      formSignIn.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('signin-email').value;
        const password = document.getElementById('signin-password').value;
        const submitBtn = document.getElementById('btn-submit-signin');

        setButtonLoading(submitBtn, true, 'Sign In to Dashboard');

        const result = await HelioAuth.signIn(email, password);

        if (result.success) {
          showAlert('Autentikasi berhasil! Mengalihkan ke dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'homepage.html';
          }, 600);
        } else {
          setButtonLoading(submitBtn, false, 'Sign In to Dashboard');
          showAlert(result.error || 'Gagal masuk. Periksa kembali email dan password.');
        }
      });

      // 7. Sign Up submit
      formSignUp.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const name = document.getElementById('signup-name').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        const confirmPw = document.getElementById('signup-confirm-password').value;
        const submitBtn = document.getElementById('btn-submit-signup');

        if (password !== confirmPw) {
          showAlert('Konfirmasi password tidak cocok.');
          return;
        }

        setButtonLoading(submitBtn, true, 'Create New Account');

        const result = await HelioAuth.signUp(email, password, name);

        if (result.success) {
          if (result.needsEmailConfirmation) {
            showAlert('Pendaftaran akun berhasil! Silakan cek email Anda untuk konfirmasi, lalu masuk.', 'success');
            setButtonLoading(submitBtn, false, 'Create New Account');
            setTimeout(() => {
              tabSignIn.click();
            }, 2500);
          } else {
            showAlert('Pendaftaran akun berhasil! Mengalihkan ke dashboard...', 'success');
            setTimeout(() => {
              window.location.href = 'homepage.html';
            }, 700);
          }
        } else {
          setButtonLoading(submitBtn, false, 'Create New Account');
          showAlert(result.error || 'Gagal mendaftar.');
        }
      });

      // 8. Google OAuth click
      const btnGoogle = document.getElementById('btn-google-auth');
      if (btnGoogle) {
        btnGoogle.addEventListener('click', async () => {
          hideAlert();
          btnGoogle.disabled = true;
          btnGoogle.innerHTML = `<span class="spinner" style="border-top-color:#1f2937;"></span> <span>Menghubungkan ke Google...</span>`;

          const result = await HelioAuth.signInWithGoogle();

          if (!result.success) {
            btnGoogle.disabled = false;
            btnGoogle.innerHTML = `
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.29 21.36 7.37 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.96 0 12s.46 3.84 1.26 5.42l4.02-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.29 2.64 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
              <span>Continue with Google</span>`;
            showAlert(result.error);
          }
        });
      }

      // 9. Quick Demo Bypass
      if (btnQuickDemo) {
        btnQuickDemo.addEventListener('click', () => {
          HelioAuth.loginDemo();
          showAlert('Memasuki mode demonstrasi...', 'success');
          setTimeout(() => {
            window.location.href = 'homepage.html';
          }, 400);
        });
      }

      // 10. Forgot password helper
      if (forgotLink) {
        forgotLink.addEventListener('click', (e) => {
          e.preventDefault();
          const emailInput = document.getElementById('signin-email').value;
          if (!emailInput) {
            showAlert('Ketik email Anda di kolom Email Address terlebih dahulu untuk reset password.', 'warning');
          } else {
            showAlert(`Tautan reset instruksi dikirim ke ${emailInput} (jika terdaftar di Supabase).`, 'warning');
          }
        });
      }
    });
  </script>
</body>
</html>
